<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#486f69" />
    <meta name="description" content="وئام - منصة تنسيق رحلة رعاية الطفل" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/weam-icon.svg" />
    <title>وئام</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('weam_theme')
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
          var scale = localStorage.getItem('weam_text_scale')
          var zoom = scale === 'large' ? '1.22' : scale === 'xlarge' ? '1.38' : '1.08'
          document.documentElement.style.setProperty('--a11y-zoom', zoom)
        } catch (e) {}
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'))
      }
    </script>
  </body>
</html>
